name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow opens its PR with GITHUB_TOKEN, which starts no workflows.
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Read-only: this job runs the branch's code, so it must not be able to post statuses.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run compile
      - name: dist matches the sources
        run: git diff --exit-code -- dist
      - run: bun test

  # Dispatched runs are not attached to a PR, so mirror the result as the statuses the ruleset requires.
  # A separate job that runs no repository code, so a test cannot fake them.
  report:
    needs: check
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ needs.check.result == 'success' && 'success' || 'failure' }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for os in ubuntu-latest macos-latest windows-latest; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$STATE" -f context="check ($os)" -f target_url="$URL"
          done
