name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release and issue-to-PR workflows open PRs with GITHUB_TOKEN, which starts no workflows.
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run compile
      - name: dist matches the sources
        run: git diff --exit-code -- dist
      - run: bun test
      # Dispatched runs are not attached to a PR, so mirror the result as the status the ruleset requires.
      - name: Report the result to the PR
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -f state="$STATE" -f context="check (${{ matrix.os }})" -f target_url="$URL"
