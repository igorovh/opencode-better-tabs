# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      # Bun for the checks, plus OpenCode, ttyd, ffmpeg and Chromium for `bun run record`.
      - uses: ./.github/actions/setup-record
      - name: Run agent
        uses: pullfrog/pullfrog@0741f79ecebfa4469a010644d2aed2d96d32d489 # v0.1.127
        with:
          prompt: ${{ inputs.prompt }}
          push: restricted
          shell: restricted
        # The model and OPENCODE_API_KEY come from the Pullfrog console, not from secrets here.
