# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      # The agent runs bun for typecheck, tests, compile and the UI preview.
      - uses: oven-sh/setup-bun@v2
      - name: Run agent
        uses: pullfrog/pullfrog@88bcc3d4bb26951b99fafe09f65d90d20d5b6d62 # v0.1.126
        with:
          prompt: ${{ inputs.prompt }}
          push: restricted
          shell: restricted
        # The model and OPENCODE_API_KEY come from the Pullfrog console, not from secrets here.
