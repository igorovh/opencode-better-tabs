name: Set up recording
description: Installs OpenCode, ttyd, ffmpeg and Chromium on PATH for `bun run record`.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
    - shell: bash
      run: |
        # Match the OpenCode version the tests and dist are built against.
        version=$(jq -r '.devDependencies["@opencode/plugin"]' package.json)
        # npm runs the postinstall that puts the platform binary in place; bun skips it.
        npm install --global "@opencode/cli@$version"
        sudo curl -fsSL -o /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
        sudo chmod +x /usr/local/bin/ttyd
        sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
        bun install --frozen-lockfile
        bunx playwright install --with-deps chromium
